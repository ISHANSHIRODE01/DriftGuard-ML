name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Verify drift detector on synthetic drift
        run: python -c "
          import pandas as pd, numpy as np
          from src.drift.detector import DriftDetector
          r=np.random.default_rng(0)
          ref=pd.DataFrame({'x':r.normal(0,1,5000)})
          cur=pd.DataFrame({'x':r.normal(3,1,5000)})
          rep=DriftDetector().detect(ref,cur)
          assert rep.dataset_drift_detected, 'failed to detect obvious drift'
          print('drift detector smoke test passed')"
        env:
          PYTHONPATH: .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check src/ tests/ experiments/ --select=E9,F63,F7,F82
