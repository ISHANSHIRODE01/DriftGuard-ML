services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driftguard
      POSTGRES_PASSWORD: driftguard
      POSTGRES_DB: driftguard
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://driftguard:driftguard@db:5432/driftguard
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./artifacts:/app/artifacts"]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg2://driftguard:driftguard@db:5432/driftguard
    ports: ["8501:8501"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
